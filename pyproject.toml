[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yohaku"
version = "0.1.0b1"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Proactive Context Compaction Manager"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
yohaku = "yohaku.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yohaku = ["dsh_host.mjs", "opencode_receipt_hook.mjs"]
