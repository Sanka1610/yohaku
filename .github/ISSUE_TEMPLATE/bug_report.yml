name: Bug / Problem
description: 不具合、予期しない状態、導入・停止の問題を報告する。
body:
  - type: markdown
    attributes:
      value: |
        Credential、token、auth.json、private transcript、文書本文、raw config / stateは投稿しないでください。
        Error codeと公開可能なstateだけをsanitizeして共有してください。
        AMBIGUOUS、RECOVERY_REQUIRED、write uncertaintyでは、報告のためにblind rerunしないでください。既存stateを保持してください。
        [Privacy / security reporting](https://github.com/Sanka1610/yohaku/blob/main/docs/issue-reporting.md#security-reporting)
  - type: input
    id: version
    attributes:
      label: Yohaku version
      description: 未公開checkoutならその旨を記載。不明ならUNKNOWN。
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime / version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Python
      description: Hostname、user名、absolute pathは不要です。
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: 症状
      description: 既に観測した内容を短く記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Sanitized error / state
      description: Raw JSON、log、DB、state archiveを貼らないでください。
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順（任意）
      description: 安全に共有できる既知の手順だけ。曖昧なtaskを再実行して確認する必要はありません。
